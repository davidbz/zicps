name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - name: Check formatting
        run: zig fmt --check src/ test/ tools/ boards/list.zig build.zig

  lint-actions:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  test:
    name: Test / ${{ matrix.os }} / Zig ${{ matrix.zig }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig: ["0.16.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ matrix.zig }}
      # raylib links against X11 and GL on Linux; the macOS and Windows runners
      # already ship what it needs.
      - name: Install raylib build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libasound2-dev
      # Cache the Zig build cache to speed up incremental builds.
      # Key includes the zon hash so a dep change busts it correctly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .zig-cache
            ~/.cache/zig
            ~/Library/Caches/zig
            ~/AppData/Local/zig
          key: zig-${{ runner.os }}-${{ matrix.zig }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ matrix.zig }}-
            zig-${{ runner.os }}-
      # The two sound references are the only things this job fetches, and the
      # only suites that skip themselves when their data is missing (DESIGN.md
      # §9 M4, M9), so they run ahead of `check`: a fetch that ran late would be
      # a green build that tested less than it looks. The video milestones score
      # against an acceptance ROM that is not fetched at all —
      # test/system_test.zig assembles it. The other fetched tree, MAME's CPS-1
      # drivers, has a job of its own below, because nothing in this one reads it.
      - name: Fetch the differential sound references
        shell: bash
        run: |
          ./tools/fetch_qsound_reference.sh
          ./tools/fetch_opm_reference.sh
      - name: Compile check
        run: zig build check
      - name: Run tests
        run: zig build test

  # boards/ is generated and committed (DESIGN.md §8.1), which is only safe if
  # something re-derives it. This fetches the MAME tree the generator reads —
  # pinned to a commit, checksummed by the script — regenerates every board
  # file, and fails on any difference. A hand-edit to a board file, a generator
  # change nobody re-ran, or a bumped MAME pin whose tables moved all show up
  # here as a diff rather than as a set that draws wrong for a user.
  boards:
    name: Board library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - name: Fetch MAME's Capcom drivers
        shell: bash
        run: ./tools/fetch_mame_source.sh
      - name: Regenerate the board library
        run: zig build boards -- testdata/mame
      - name: Check the board library is what the generator writes
        run: git diff --exit-code -- boards/

  # zigesis ran Nemesis' VDPFIFOTesting as a second job here, pinning a score
  # per page and failing when one moved in either direction. Its analogue needs
  # no job of its own: the scoreboard over the in-repo test ROM is a test like
  # any other, so `zig build test` above already runs it. `zig build testrom`
  # is that one test by itself, for reading the table when a score moves.
